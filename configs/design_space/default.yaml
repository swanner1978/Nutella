id: default
version: "1"
parameters:
  - name: blade_curvature
    type: continuous
    lower_bound: 0.5
    upper_bound: 2.0
    default: 1.0
    unit: "1/mm"
  - name: blade_thickness_mm
    type: continuous
    lower_bound: 1.0
    upper_bound: 4.0
    default: 2.0
    unit: mm
  - name: wall_clearance_mm
    type: continuous
    lower_bound: 0.1
    upper_bound: 1.0
    default: 0.3
    unit: mm
  - name: handle_length_mm
    type: continuous
    lower_bound: 80.0
    upper_bound: 150.0
    default: 120.0
    unit: mm
